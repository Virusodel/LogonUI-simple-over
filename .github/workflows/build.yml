name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Install .NET Framework 4.0 Targeting Pack
      run: |
        curl -L -o vs_buildtools.exe https://aka.ms/vs/17/release/vs_buildtools.exe
        vs_buildtools.exe --quiet --wait --norestart --installPath "C:\BuildTools" --add Microsoft.VisualStudio.ComponentGroup.NetFramework.Tools --add Microsoft.VisualStudio.Component.Windows10SDK.20348
      shell: cmd
    
    - name: Restore NuGet packages
      run: |
        nuget restore CustomLogonUI/CustomLogonUI.csproj
      shell: cmd
    
    - name: Build CustomLogonUI
      run: |
        msbuild CustomLogonUI/CustomLogonUI.csproj /p:Configuration=Release /p:Platform=AnyCPU
      shell: cmd
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: CustomLogonUI
        path: CustomLogonUI\bin\Release\LogonUI.exe
